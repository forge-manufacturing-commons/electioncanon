<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0A09" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>ElectionCanon — The Operating System for Running an Election Campaign</title>
    <meta name="description" content="ElectionCanon is an open-source operating system for running an election campaign — territory, organisation, geographic responsibility, readiness, coordination, and election-day operations, from campaign command to polling unit." />

    <meta property="og:title" content="ElectionCanon — The Operating System for Running an Election Campaign" />
    <meta property="og:description" content="From campaign command to polling unit, everyone knows what they are responsible for, where they are responsible, and what still needs to be done. Open source, built on an accountable event record." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://electioncanon.org" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ElectionCanon — The Operating System for Running an Election Campaign" />
    <meta name="twitter:description" content="From campaign command to polling unit, everyone knows what they are responsible for, where they are responsible, and what still needs to be done." />

    <!-- NO LOGO ASSET: no real ElectionCanon mark exists yet. Reusing
         Forge-A-Truck's would be dishonest branding; inventing one
         would violate this project's own "no claim without proof"
         discipline. apple-touch-icon/og:image are intentionally
         omitted — add a real mark here (and to
         public/manifest.webmanifest's `icons`) once one exists. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}))
      }
    </script>
  </body>
</html>
